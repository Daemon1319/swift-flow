# 1. GLOBAL SETTINGS
spring:
  application:
    name: swift-flow
  profiles:
    active: local
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=5m
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

---
# 2. LOCAL PROFILE
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5438/swift-flow-local
    username: postgres
    password: postgres

server:
  port: 8085

app:
  cors:
    allowed-origins: http://localhost:3000

---
# 3. PROD PROFILE
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

server:
  port: ${PORT:8085}
  shutdown: graceful
  forward-headers-strategy: NATIVE

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
